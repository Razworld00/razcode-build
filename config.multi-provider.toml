# ─── Token Harbor (one key, many models) ───────────────────────────────────
# Set TOKENHARBOR_API_KEY in your environment. Do NOT paste the key into this file.
# Base URL: https://tokenharbor.ai/v1
# Catalog:  https://tokenharbor.ai/models

[model.th-orchestra]
model = "th-orchestra"
base_url = "https://tokenharbor.ai/v1"
name = "Token Harbor Orchestra"
description = "Token Harbor smart router (coding-agent default)"
env_key = "TOKENHARBOR_API_KEY"
api_backend = "chat_completions"
context_window = 200000

[model.th-deepseek-v4-flash]
model = "deepseek-v4-flash"
base_url = "https://tokenharbor.ai/v1"
name = "DeepSeek V4 Flash (Token Harbor)"
env_key = "TOKENHARBOR_API_KEY"
api_backend = "chat_completions"
context_window = 128000

[model.th-glm-5.2]
model = "glm-5.2"
base_url = "https://tokenharbor.ai/v1"
name = "GLM 5.2 (Token Harbor)"
env_key = "TOKENHARBOR_API_KEY"
api_backend = "chat_completions"
context_window = 200000

[model.th-claude-opus]
model = "claude-opus-5"
base_url = "https://tokenharbor.ai/v1"
name = "Claude Opus (Token Harbor)"
env_key = "TOKENHARBOR_API_KEY"
api_backend = "chat_completions"
context_window = 200000

# ─── Optional cloud providers (only used when you set the env key) ────────

[model.grok-4]
model = "grok-4"
base_url = "https://api.x.ai/v1"
name = "Grok 4"
env_key = "XAI_API_KEY"
api_backend = "responses"
context_window = 256000

[model.claude-sonnet]
model = "claude-sonnet-4-20250514"
base_url = "https://api.anthropic.com"
name = "Claude Sonnet 4"
env_key = "ANTHROPIC_API_KEY"
api_backend = "messages"
extra_headers = { "anthropic-version" = "2023-06-01" }
context_window = 200000

[model.gpt-4.1]
model = "gpt-4.1"
base_url = "https://api.openai.com/v1"
name = "GPT-4.1"
env_key = "OPENAI_API_KEY"
api_backend = "chat_completions"
context_window = 128000
