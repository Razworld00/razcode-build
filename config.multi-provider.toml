# ═══════════════════════════════════════════════════════════════════════
# Razcode Build — Multi-Provider Configuration (Local-First)
# Copy to:  ~/.razcode/config.toml   (Grok Build also reads ~/.grok/config.toml)
# ═══════════════════════════════════════════════════════════════════════

[models]
default = "gpt-oss-120b-cloud"

# ─── YOUR OLLAMA MODELS (from `ollama list`) ───────────────────────────
# All use the local OpenAI-compatible endpoint. No API key required.

[model.gpt-oss-120b-cloud]
model = "gpt-oss:120b-cloud"
base_url = "http://localhost:11434/v1"
name = "GPT-OSS 120B Cloud"
description = "Primary local/cloud model via Ollama"
api_backend = "chat_completions"
context_window = 128000

